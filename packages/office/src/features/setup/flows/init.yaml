# `opencorp init`'s interview: a chat with OpenCorp, in the chat flow's shape, one LOOP iteration per turn. Each turn
# takes everything the owner sent since the last one, and the reply works out with them the company, its owner and
# its first teammates; messages sent while the reply works steer it. It proposes the company with propose_company,
# which shows the owner a card. The chat ends once the owner has accepted the company there, or the inbox closes.
# init asks for the password and the remote itself, before this chat, so the model never sees them.
id: init
name: init
description: Interview the owner, in a chat, for a new company, its owner and its first teammates, and propose it.
input:
  messages: !Inbox(Message)  # what the owner sends; read by each turn's take and, while the reply works, as steers
  known: !str  # JSON: facts the owner already gave (flags) and suggestions (login name)

defs:
  turn:
    input:
      messages: !Inbox(Message)
      known: !str
      history: !list(Message)
      closed: !bool
      accepted: !bool
    nodes:
      # The turn: everything sent since the last one. Messages read along with a close aren't answered.
      heard:
        kind: call
        call: take
        input:
          from: ${input.messages}
          take: all
      route:
        kind: case
        cases:
          - when: ${heard.output.events != [] and not heard.output.closed}
            then: reply
      reply:
        kind: agent
        steer_inbox: ${input.messages}
        tools: [ask_user, propose_company]
        input:
          history: ${input.history}
          said: ${heard.output.events}
          known: ${input.known}
        output: !Optional(str)  # null only after an interrupt
        system_prompt: |-
          You are OpenCorp, setting up a new OpenCorp company with its owner, the human you are chatting with. The
          owner is the company's CEO. The teammates are AI agents who report to the owner.

          Collect:
          - the company's name;
          - the owner's name, handle and title (default "CEO");
          - zero or more first teammates, each with a name, a handle, a title, and one or two sentences about their
            work, which start the profile they work from.

          A handle is 1 to 32 characters: lowercase letters, digits and hyphens, starting and ending with a letter or a
          digit. Every handle must differ from the others. Offer one made from the person's name, such as "minh" for
          Minh or "hong-ngoc" for Hong Ngoc.

          Ask one short question at a time in your reply; the owner answers in the chat. When there are obvious choices,
          ask with the ask_user tool instead, and offer them as options. Don't ask about anything in "given" below; use
          it as it is. In "given", "name", "handle" and "title" are the owner's, and "agent" and "agent_handle" are the
          first teammate's name and handle. Ask about each owner field that isn't in "given", offering its "suggested"
          value. Unless "given" has "agent", ask who the first teammates should be; most owners start with one, such as
          an engineer, and may also choose none.

          Never ask for a password, an API key, a token or a git remote URL: `opencorp init` asked for those itself,
          before this chat.

          When you have everything, call propose_company with the company. It checks it first: if it lists problems,
          ask the owner how to fix each one, then propose again. Otherwise it shows the owner the company on a card, and
          tells you their answer. When they want changes, it says what, or to ask what; then propose again. Problems and
          the owner's changes override "given": if either says a given handle is taken, ask for a new one. Once
          propose_company says "Accepted", reply with one line for the owner.

          Already known (JSON):
          ${known}
        prompt:
          - ${history}
          - ${said}
    # The loop carries the messages inbox itself, so the output leaves it out. `accepted` is propose_company's own
    # result, which says the owner accepted the company; the model's words can't set it.
    output:
      known: ${input.known}
      history: ${input.history + heard.output.events + (reply.new_messages :- [])}
      closed: ${heard.output.closed}
      accepted: ${input.accepted or any([p.name == "propose_company" and startswith(p.content, "Accepted:") for m in (reply.new_messages :- []) for p in m.parts if p.type == "tool_result"])}

nodes:
  chat:
    kind: loop
    call: turn
    input:
      messages: ${input.messages}
      known: ${input.known}
      history: []
      closed: false
      accepted: false
    while: not closed and not accepted
output:
  history: ${chat.output.history}
