# The profile manager: the owner chats with it to edit one person's profile.md. It reads the
# profile and proposes edits; the owner applies them from the profile view. It has the same
# turn and reply node names as chat.yaml, so the office drives it like a chat.
id: profile_manager
name: profile_manager
description: Edit a person's profile with the owner.

typedefs:
  Msg:
    role: Literal(user, assistant)
    text: str
input:
  steers: !Inbox(str)  # what people send while the reply works; the office sends it
  history: !list(Msg)  # the conversation so far; the office passes [] for a new chat

defs:
  turn:
    input:
      steers: !Inbox(str)
      history: !list(Msg)
      exited: !bool
      reply: !str
    nodes:
      # The turn's one input: what the owner sent. Every node below reads it from here.
      ask:
        kind: tool
        tool_id: ask
        input:
          prompt: "You:"
        output: str
      route:
        kind: case
        on: ${ask.output}
        cases:
          - when: /exit
            then: exit_turn
        else: reply
      exit_turn:
        kind: code
        output:
          exited: bool
        code: |
          return {exited: true}
      reply:
        kind: agent
        steer_inbox: ${input.steers}
        env:
          max_tool_iterations: 20
        tools: [profile]
        input:
          history: ${input.history}
          message: ${ask.output}
        output: str
        system_prompt: |-
          You help the company's owner edit one person's profile (their profile.md), the
          document that person's agent reads in every run. Call `read` for the current text
          and its version. To change the profile, call `propose_edit` with the complete new
          text and the version you read, then summarise the change. The owner reviews the
          diff and applies it; nothing changes until then.
        prompt:
          - ${history}
          - user: ${message}
      # Code, not an output expression: yian evaluates both sides of an expression, so appending the
      # reply there fails the exit turn, where reply never ran.
      remember:
        kind: code
        input:
          history: ${input.history}
          message: ${ask.output}
          reply: ${reply.output}
        output: list(Msg)
        code: |
          return [...inputs.history, {role: "user", text: inputs.message}, {role: "assistant", text: inputs.reply}]
    # An exit turn leaves the history as it was.
    output:
      history: ${remember.output :- input.history}
      exited: ${exit_turn.output.exited == true}
      reply: '${reply.output:-""}'

nodes:
  chat:
    kind: loop
    call: turn
    input:
      steers: ${input.steers}
      history: ${input.history}
      exited: false
      reply: ""
    while: not exited
output: ${chat.output.reply}
