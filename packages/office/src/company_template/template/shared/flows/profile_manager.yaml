# The profile manager: the owner chats with it to edit one person's profile.md. It reads the
# profile and proposes edits; the owner applies them from the profile view. It has the same
# turn and reply node names and the same messages inbox as chat.yaml, so the office drives it
# like a chat.
id: profile_manager
name: profile_manager
description: Edit a person's profile with the owner.

uses:
  compact_history: compact_history  # shared/flows/compact_history.yaml, yian's example

input:
  messages: !Inbox(Message)  # what the owner sends; read by each turn's take and, while the reply works, as steers
  summary: !str  # older turns folded by compact_history; "" for a new chat
  history: !list(list(Message))  # the kept turns, one list of messages each; [] for a new chat
  turns: !int  # the session's turns so far
  max_turns: !int  # the run ends once turns reaches it

defs:
  # The history so far, compacted, plus its kept turns as one list: a prompt splice must be a lone
  # `${name}`, so the flattening sits in this derived binding rather than on the reply.
  context:
    input:
      summary: !str
      history: !list(list(Message))
    nodes:
      compacted:
        kind: call
        call: compact_history
        input:
          summary: ${input.summary}
          history: ${input.history}
    output:
      summary: ${compacted.output.summary}
      history: ${compacted.output.history}
      messages: ${[m for t in compacted.output.history for m in t]}
  turn:
    input:
      messages: !Inbox(Message)
      summary: !str
      history: !list(list(Message))
      closed: !bool
      turns: !int
      max_turns: !int
    nodes:
      context:
        kind: call
        call: context
        input:
          summary: ${input.summary}
          history: ${input.history}
      # The turn: everything sent since the last one. Messages read along with a close aren't answered.
      heard:
        kind: tool
        tool_id: take
        input:
          from: ${input.messages}
          take: all
      route:
        kind: case
        cases:
          - when: ${heard.output.events != [] and not heard.output.closed}
            then: reply
      reply:
        kind: agent
        steer_inbox: ${input.messages}
        env:
          max_tool_iterations: 20
        tools: [profile]
        input:
          summary: ${context.output.summary}
          history: ${context.output.messages}
          said: ${heard.output.events}
        output: Optional(str)  # null only after an interrupt
        system_prompt: |-
          You help the company's owner edit one person's profile (their profile.md), the
          document that person's agent reads in every run. Call `read` for the current text
          and its version. To change the profile, call `propose_edit` with the complete new
          text and the version you read, then summarise the change. The owner reviews the
          diff and applies it; nothing changes until then.
          A summary of this conversation's older turns (empty while it is short): ${summary}
        prompt:
          - ${history}
          - ${said}
    # The loop carries the messages inbox itself, so the output leaves it out. A close with nothing
    # queued appends an empty turn; the run ends right after.
    output:
      summary: ${context.output.summary}
      history: ${context.output.history + [heard.output.events + (reply.new_messages :- [])]}
      closed: ${heard.output.closed}
      turns: ${input.turns + 1}
      max_turns: ${input.max_turns}

nodes:
  chat:
    kind: loop
    call: turn
    input:
      messages: ${input.messages}
      summary: ${input.summary}
      history: ${input.history}
      closed: false
      turns: ${input.turns}
      max_turns: ${input.max_turns}
    while: not closed and turns < max_turns
output:
  summary: ${chat.output.summary}
  history: ${[m for t in chat.output.history for m in t]}
