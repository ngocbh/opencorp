# A person's main chat: one LOOP iteration per turn. The reply agent keeps the
# conversation in session memory; the person's profile is memory on the whole flow.
id: chat
name: chat
description: Chat with a person in the office.
long_term_memory: profile

typedefs:
  Person:
    name: str
    handle: str
    title: str
    company: str
    reports_to: str  # "You report to <Name> (@<handle>)." or ""
input:
  person: !Person  # who the reply speaks as; the office passes it
  talking_to: !str  # "You're talking with <Name> (@<handle>), <roles>." or ""; the office passes it

defs:
  turn:
    input:
      person: !Person
      talking_to: !str
      exited: !bool
      reply: !str
    nodes:
      ask:
        kind: human_input
        prompt: "You:"
        output: str
      route:
        kind: case
        on: ${ask.output}
        cases:
          - when: /exit
            then: exit_turn
        else: reply
      exit_turn:
        kind: code
        output:
          exited: bool
        code: |
          return {"exited": True}
      reply:
        kind: agent
        steerable: true
        long_term_memory: session
        env:
          max_tool_iterations: 100
        tools: [toolbox, workspace, company, ask_user]
        skills: all
        input:
          message: ${ask.output}
          person: ${input.person}
          talking_to: ${input.talking_to}
        output: str
        system_prompt: |-
          You are ${person.name} (@${person.handle}), ${person.title} at ${person.company}. ${person.reports_to} ${talking_to}
          You work in the office alongside the people you talk with. Speak as yourself, in the first person;
          you are a person here, not a generic assistant. Your profile, in the memory below, is what you've
          learned about your work and the people you work with: follow it. Use your tools to gather the facts
          you need, and ask people only through the ask_user tool.
        prompt: "${message}"
    # A LOOP body maps its carried record to the next one, so the person and who they talk with ride along unchanged.
    output:
      person: ${input.person}
      talking_to: ${input.talking_to}
      exited: ${exit_turn.output.exited == true}
      reply: '${reply.output:-""}'

nodes:
  chat:
    kind: loop
    call: turn
    input:
      person: ${input.person}
      talking_to: ${input.talking_to}
      exited: false
      reply: ""
    while: not exited
    max: 10000
output: ${chat.output.reply}
