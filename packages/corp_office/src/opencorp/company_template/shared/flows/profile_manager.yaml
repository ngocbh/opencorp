# The profile manager: the owner chats with it to edit one person's profile.md. It reads the
# profile and proposes edits; the owner applies them from the profile view. It has the same
# turn and reply node names as chat.yaml, so the office drives it like a chat.
id: profile_manager
name: profile_manager
description: Edit a person's profile with the owner.

defs:
  turn:
    input:
      exited: !bool
      reply: !str
    nodes:
      ask:
        kind: human_input
        prompt: "You:"
        output: str
      route:
        kind: case
        on: ${ask.output}
        cases:
          - when: /exit
            then: exit_turn
        else: reply
      exit_turn:
        kind: code
        output:
          exited: bool
        code: |
          return {"exited": True}
      reply:
        kind: agent
        steerable: true
        long_term_memory: session
        env:
          max_tool_iterations: 20
        tools: [profile]
        input:
          message: ${ask.output}
        output: str
        prompt: |-
          You help the company's owner edit one person's profile (their profile.md), the
          document that person's agent reads in every run. Call `read` for the current text
          and its version. To change the profile, call `propose_edit` with the complete new
          text and the version you read, then summarise the change. The owner reviews the
          diff and applies it; nothing changes until then.

          The owner says: ${message}
    output:
      exited: ${exit_turn.output.exited == true}
      reply: '${reply.output:-""}'

nodes:
  chat:
    kind: loop
    call: turn
    input:
      exited: false
      reply: ""
    while: not exited
    max: 10000
output: ${chat.output.reply}
