# `ac init`'s flow: interview the owner until they accept a company, then ask for a password and a remote.
# Only code nodes read the password and the remote, so the model never sees them.
id: init
name: init
description: Make a new company with its owner, then ask for the CEO's password and a git remote.
typedefs:
  Owner: {name: str, handle: str, title: str}
  Teammate: {name: str, handle: str, title: str, about: str}
  Answers:
    company: str
    owner: Owner
    teammates: list[Teammate]
input:
  known: str    # JSON: facts the owner already gave (flags) and suggestions (login name)
  remote: str   # the --remote flag, or ""
nodes:
  rounds:
    kind: loop
    input:
      known: ${input.known}  # carried: a loop body can't read the flow's input
      draft: ""              # JSON of the last answers
      changes: ""            # what's wrong with the draft, or what the owner wants changed
      accepted: false
    until: accepted
    max: 10
    nodes:
      interview:
        kind: agent
        mode: tool_calling
        tools: [ask_user, check_company]
        input:
          known: ${input.known}
          draft: ${input.draft}
          changes: ${input.changes}
        output: Answers
        prompt: |-
          You are setting up a new AgentCorp company with its owner, the human you are talking to. The owner is
          the company's CEO. The teammates are AI agents who report to the owner.

          Collect:
          - the company's name;
          - the owner's name, handle and title (default "CEO");
          - zero or more first teammates, each with a name, a handle, a title, and one or two sentences about
            their work, which start the profile they work from.

          A handle is 1 to 32 characters: lowercase letters, digits and hyphens, starting and ending with a
          letter or a digit. Every handle must differ from the others. Suggest one made from the person's name,
          such as "minh" for Minh or "hong-ngoc" for Hong Ngoc.

          Ask with the ask_user tool, one short question at a time. Offer options when there are obvious
          choices. Don't ask about anything in "given" below; use it as it is. In "given", "name", "handle" and
          "title" are the owner's, and "agent" and "agent_handle" are the first teammate's name and handle.
          Ask about each owner field that isn't in "given", offering its "suggested" value as an option. Unless
          "given" has "agent", ask who the first teammates should be; most owners start with one, such as an
          engineer, and may also choose none.

          Never ask for a password, an API key, a token or a git remote URL: `ac init` asks for those itself.

          When the last draft below isn't empty, start from it and ask only about what "What to change" says.
          "What to change" and check_company's problems override "given": if either says a given handle is taken,
          ask for a new one.

          When you have everything, call check_company with the result. If it lists problems, ask the owner how to
          fix each one, then check again. Return the result once check_company says "No problems.".

          Already known (JSON):
          ${known}

          Last draft (JSON, empty on the first run):
          ${draft}

          What to change:
          ${changes}
      confirm:
        kind: code
        input:
          answers: ${interview.output}
        output: {draft: str, changes: str, accepted: bool}
        code: agent_corp.install.interview:confirm
    output:
      known: ${input.known}
      draft: ${confirm.output.draft}
      changes: ${confirm.output.changes}
      accepted: ${confirm.output.accepted}
  answers:
    kind: code
    input:
      draft: ${rounds.output.draft}
    output: Answers
    code: |
      import json
      return json.loads(inputs["draft"])
  password:
    kind: code
    depends_on: [answers]  # without it, the password is asked before the interview
    input: {}
    output: Optional[str]
    code: agent_corp.install.init:password
  remote:
    kind: code
    depends_on: [password]
    input:
      given: ${input.remote}
    output: str
    code: agent_corp.install.init:remote
output:
  company: ${answers.output.company}
  owner: ${answers.output.owner}
  teammates: ${answers.output.teammates}
  password_hash: ${password.output}
  remote: ${remote.output}
