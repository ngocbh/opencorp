# A finished session's debrief, written by the person from the session's transcript.
# The profile is memory on the whole flow, so feedback on a debrief reaches profile.md.
id: debrief
name: debrief
description: Debrief a finished session from its transcript.
long_term_memory: profile
input:
  transcript: str
nodes:
  debrief:
    kind: agent
    # A failed debrief is retried by the office (on its tick or GET /debriefs), not here.
    retries: 0
    input:
      transcript: ${input.transcript}
    output:
      summary: str
      status: str
      artifacts: list[str]
      decisions: list[str]
      follow_ups: list[str]
      open_questions: list[str]
    prompt: |-
      You have just finished the work session below. Debrief it for the person who asked
      for the work:
      - summary: two or three sentences on what happened;
      - status: one word or short phrase for where the work stands (for example done,
        blocked, or in progress);
      - artifacts: the files, branches, PRs, or documents you made or changed;
      - decisions: the choices made, each as one sentence;
      - follow_ups: work that should happen next, each as one short task title;
      - open_questions: what is still unclear or needs someone's answer.
      Use empty lists where there is nothing to say.

      Transcript:
      ${transcript}
output: ${debrief.output}
