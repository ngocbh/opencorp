name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  office:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      UV_LOCKED: 1   # fail if uv.lock is stale, for both `uv sync` and `uv run`
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COMPOSER_READ_TOKEN }}   # yian is private
          persist-credentials: false
      # setup-uv publishes no floating major tags, so pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      # tests/e2e needs bun and runs in the e2e job, on both OSes.
      - run: uv run pytest -q packages/corp_office/tests --ignore=packages/corp_office/tests/e2e
  sandbox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COMPOSER_READ_TOKEN }}   # yian is private
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync
      - run: uv run pytest -q packages/corp_office/tests/sandbox
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COMPOSER_READ_TOKEN }}   # yian is private
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
      - if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync
      - run: bun install --frozen-lockfile
      - run: uv run pytest -q packages/corp_office/tests/e2e
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        working-directory: packages/protocol
      # `bun test` exits 1 when a package has no test files yet.
      - if: ${{ hashFiles('packages/tui/**/*.test.ts', 'packages/tui/**/*.test.tsx', '!packages/tui/node_modules/**') != '' }}
        run: bun test
        working-directory: packages/tui
      - if: ${{ hashFiles('packages/cli/**/*.test.ts', 'packages/cli/**/*.test.tsx', '!packages/cli/node_modules/**') != '' }}
        run: bun test
        working-directory: packages/cli
