name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COMPOSER_READ_TOKEN }}   # yian is private
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The office's sandbox tests fail on CI without bwrap.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bun run typecheck
      - run: bun test
        working-directory: packages/protocol
      # `bun test` exits 1 when a package has no test files yet.
      - if: ${{ hashFiles('packages/client/**/*.test.ts', '!packages/client/node_modules/**') != '' }}
        run: bun test
        working-directory: packages/client
      - if: ${{ hashFiles('packages/tui/**/*.test.ts', 'packages/tui/**/*.test.tsx', '!packages/tui/node_modules/**') != '' }}
        run: bun test
        working-directory: packages/tui
      - if: ${{ hashFiles('packages/cli/**/*.test.ts', 'packages/cli/**/*.test.tsx', '!packages/cli/node_modules/**') != '' }}
        run: bun test
        working-directory: packages/cli
      - if: ${{ hashFiles('packages/office/**/*.test.ts', '!packages/office/node_modules/**') != '' }}
        run: bun test
        working-directory: packages/office
      - if: ${{ hashFiles('packages/app/**/*.test.ts', '!packages/app/node_modules/**') != '' }}
        run: bun test ./test
        working-directory: packages/app
  # The office is the platform-sensitive package (sandbox, service, platform), and its suite holds
  # the e2e tests, so it runs on macOS too. The other packages are platform-independent and macOS
  # runner minutes are billed at ten times the Linux rate.
  office-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COMPOSER_READ_TOKEN }}   # yian is private
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/office
