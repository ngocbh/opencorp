[project]
name = "agent-corp"
version = "0.0.1"
description = "agent-corp office: daemon, run workers, sandbox, permissions."
requires-python = ">=3.12"
dependencies = [
    "agent-composer[all]",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-ulid>=4",
    "jsonschema>=4.23",
    "starlette>=1.0",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "psutil>=7",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.3",
    "datamodel-code-generator==0.83.0",
]

[tool.uv.sources]
agent-composer = { path = "agent-composer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_corp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
