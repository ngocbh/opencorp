[project]
name = "agent-corp"
version = "0.0.1"
description = "agent-corp office: daemon, run workers, sandbox, permissions."
requires-python = ">=3.12"
dependencies = [
    "agent-composer[all]",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-ulid>=3",
    "jsonschema>=4.23",
    "starlette>=0.40",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "psutil>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "datamodel-code-generator>=0.26",
]

[tool.uv.sources]
agent-composer = { path = "agent-composer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_corp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 60
